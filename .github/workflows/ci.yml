# rca-agent CI (GitHub Actions)
#
# status: RUNNING ON GITHUB ACTIONS
#   First real runs: 2026-09-26 (repo pushed to github.com/Barney0809/rca-agent).
#   · offline job: GREEN on the runner.
#   · world job: was red twice -- (1) the diagnosed system needs Redis and the
#     runner has no host Redis (fixed: use the compose `with-redis` profile and
#     let W_REDIS_URL be overridden); (2) the readiness wait polled /healthz,
#     but the services serve /health, so it timed out while every container was
#     already healthy. That second one had been in this file since it was
#     written and could never surface while the pipeline had never run -- which
#     is the whole argument for running it.
#   Everything the offline job invokes is also verifiable locally by
#   scripts/ci.ps1 (same commands).
#
# two jobs on purpose:
#   offline  - free, no Docker, no API key. Must be green for every push.
#   world    - needs Docker; brings the diagnosed system up and runs the
#              integration tests + smoke check. Kept separate so a Docker
#              hiccup cannot mask a regression in the agent code.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: offline gate (ruff + pytest + mutation/seal checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5

      - name: sync dependencies (pinned by uv.lock)
        run: uv sync

      - name: ruff static gate (undefined names / async misuse / duplicate defs)
        run: uv run ruff check --select F821,ASYNC,F811 src eval scripts tests world

      - name: pytest (world integration tests excluded; no Docker here)
        run: uv run pytest --color=no --ignore=tests/test_world.py

      - name: every mutation definition still applies (fast staleness check)
        run: uv run python scripts/mutate_check.py --verify-only

      - name: every "sealed" claim still has a mutation group behind it
        run: uv run python scripts/seal_report.py --skip-mutations

  world:
    name: world integration (docker compose + smoke + world tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5

      - name: sync dependencies
        run: uv sync

      - name: start the diagnosed system
        # CI 上没有"宿主机的原生 Redis"（本机靠 Docker Desktop 提供的
        # host.docker.internal 访问它；Linux runner 上没有那样一个宿主服务）。
        # 所以这里启用 compose 里已经准备好的**容器版 Redis**（with-redis profile），
        # 并把 W_REDIS_URL 指过去 —— 为此 docker-compose.yml 里那三行改成了可被
        # 环境变量覆盖（默认值不变，本机行为不受影响）。
        env:
          W_REDIS_URL: "redis://redis:6379/0"
        run: docker compose --profile with-redis up -d --build

      - name: wait for the three services to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then
              echo "world is up"; exit 0
            fi
            sleep 2
          done
          echo "world did not come up in time"; docker compose logs --no-log-prefix; exit 1

      - name: smoke check (chain / trace propagation / metrics)
        run: uv run python scripts/smoke_world.py

      - name: world integration tests
        run: uv run pytest --color=no tests/test_world.py

      - name: dump container logs on failure
        if: failure()
        if: always()
        run: docker compose logs --no-log-prefix
