# 被诊断系统：一条命令起全栈
#
#   docker compose up -d --build     启动
#   docker compose ps                看状态
#   docker compose logs -f order     看某个服务的日志
#
# 端口映射（本机 → 容器）：
#   order      8080  ← 唯一对外业务入口
#   inventory  8081
#   payment    8082
#
# Redis：**默认使用本机原生 Redis**，不以容器方式启动。
#   容器通过 host.docker.internal 访问宿主机（Docker Desktop for Windows 提供）。
#   密码从 .env 读取（.env 已被 .gitignore 忽略，密码不入库）。
#   若想改用容器版 Redis，执行：
#       docker compose --profile with-redis up -d
#   并同时把下面的 W_REDIS_URL 改回 redis://:<密码>@redis:6379/0
#
# ⚠️ 所有 W_* 环境变量都是"可调参数"。D2 的故障注入就是改这些值，
#    不需要改任何代码，也不需要重建镜像。

services:
  # 可选的容器版 Redis。
  # 默认不启动（靠 profile 机制），因为本机已有原生 Redis 在 6379。
  # 需要用容器版时：docker compose --profile with-redis up -d
  redis:
    image: redis:7-alpine
    container_name: rca-world-redis
    profiles: ["with-redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [rca]

  payment:
    build:
      context: .
      dockerfile: world/Dockerfile
    container_name: rca-world-payment
    command: ["python", "-m", "uvicorn", "world.payment.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      W_PORT: "8000"
      W_REDIS_URL: "${W_REDIS_URL:-redis://:${W_REDIS_PASSWORD}@host.docker.internal:6379/0}"
      W_LOG_LEVEL: "INFO"
      # ⚠️ 必须足够大，理由同 order：持有连接跨网络调下游，
      #    吞吐 ≈ 池容量 / 下游耗时。池太小时，F1（下游变慢）会在这里
      #    也触发池耗尽，症状就混了。
      W_POOL_SIZE: "64"
      W_POOL_ACQUIRE_TIMEOUT_MS: "2000"
      W_POOL_WARN_MS: "150"
      # 模拟外部风控：0ms 表示正常。D2 会把它调大来复现"下游超时"
      W_PAYMENT_RISK_LATENCY_MS: "30"
      W_PAYMENT_RISK_ERROR_RATE: "0"
      # 时区：容器默认是 UTC，会比本机早 8 小时。
      # D2 起要把"变更发生的时刻"和"日志里的时刻"对上，时区必须统一，
      # 否则根因分析会因为时间轴错位而失效。
      # 镜像里已带 /usr/share/zoneinfo/Asia/Shanghai，无需额外安装。
      TZ: "Asia/Shanghai"
    ports:
      - "8082:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [rca]

  inventory:
    build:
      context: .
      dockerfile: world/Dockerfile
    container_name: rca-world-inventory
    command: ["python", "-m", "uvicorn", "world.inventory.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      W_PORT: "8000"
      W_REDIS_URL: "${W_REDIS_URL:-redis://:${W_REDIS_PASSWORD}@host.docker.internal:6379/0}"
      W_LOG_LEVEL: "INFO"
      # ⚠️ 必须足够大，理由同 order：持有连接跨网络调下游。
      W_POOL_SIZE: "64"
      W_POOL_ACQUIRE_TIMEOUT_MS: "2000"
      W_POOL_WARN_MS: "150"
      # 下游 = payment
      W_INVENTORY_DOWNSTREAM_NAME: "payment"
      W_INVENTORY_DOWNSTREAM_URL: "http://payment:8000"
      # ★ "配置漂移"故障位：重试次数远超合理值会把 payment 打爆
      W_INVENTORY_DOWNSTREAM_RETRIES: "1"
      W_INVENTORY_DOWNSTREAM_TIMEOUT_MS: "3000"
      W_INVENTORY_DOWNSTREAM_RETRY_BACKOFF_MS: "100"
      TZ: "Asia/Shanghai"
    ports:
      - "8081:8000"
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [rca]

  order:
    build:
      context: .
      dockerfile: world/Dockerfile
    container_name: rca-world-order
    command: ["python", "-m", "uvicorn", "world.order.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      W_PORT: "8000"
      W_REDIS_URL: "${W_REDIS_URL:-redis://:${W_REDIS_PASSWORD}@host.docker.internal:6379/0}"
      W_LOG_LEVEL: "INFO"
      # ★ 这是"连接池耗尽"最容易发生的地方：它持有连接去调下游。
      #
      # ⚠️ 默认必须是【足够大】的（64），不能是 8。
      #    原因：本服务持有连接跨网络调下游，所以吞吐 ≈ 池容量 / 下游耗时。
      #    压测 30 并发时，池=8 会让 F1（下游变慢）也顺带触发池耗尽，
      #    于是 F1 与 F2 的症状混在一起，Agent 无法区分是哪一种。
      #    调大之后：只有 F2（把池改成 2）才会耗尽 —— 症状才干净。
      #
      # F2 的场景由注入器把它改成 2，这样"池被改小"才构成一条真实的
      # 配置变更事件（红鲱鱼）。
      W_POOL_SIZE: "64"
      W_POOL_ACQUIRE_TIMEOUT_MS: "2000"
      W_POOL_WARN_MS: "150"
      # 下游 = inventory
      W_ORDER_DOWNSTREAM_NAME: "inventory"
      W_ORDER_DOWNSTREAM_URL: "http://inventory:8000"
      W_ORDER_DOWNSTREAM_RETRIES: "1"
      W_ORDER_DOWNSTREAM_TIMEOUT_MS: "3000"
      W_ORDER_DOWNSTREAM_RETRY_BACKOFF_MS: "100"
      TZ: "Asia/Shanghai"
    ports:
      - "8080:8000"
    depends_on:
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [rca]

networks:
  rca:
    name: rca-world
